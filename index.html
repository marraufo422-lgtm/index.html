<!DOCTYPE html>
<html>
<head>
  <title>Free Wi-Fi Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: gray;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .loading {
      display: none;
      margin-top: 20px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Guest Wi-Fi</h1>
    <p>Tap connect to continue.</p>

    <button onclick="connectWifi()">
      Connect
    </button>

    <div class="loading" id="loading">
      Connecting...
    </div>
  </div>

  <audio id="sound">
    <source src="sound.mp3" type="audio/mpeg">
  </audio>

  <script>
    function connectWifi() {

      document.getElementById("loading").style.display = "block";

      document.getElementById("sound").play();

      if (navigator.vibrate) {
        navigator.vibrate(300);
      }

      setTimeout(() => {
        window.location.href = "https://sndtag.ru/s";
      }, 1500);
    }
  </script>

</body>
</html>
